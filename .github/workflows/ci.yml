name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify build, tests and vectors
        run: |
          make fmt vet build test vectors second demo
      - name: Differential against base
        if: github.event_name == 'pull_request'
        env:
          OLD: ${{ github.event.pull_request.base.sha }}
        run: make differential
