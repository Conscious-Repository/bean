name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Each action is named by its commit, matching release.yml: checkout v4,
      # setup-go v5, setup-python v5, upload-artifact v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install -r tools/requirements.txt
      # Before anything else writes a file: the page names its commit only
      # when it is built from a clean checkout.
      - name: Build the check page and record its SHA-256
        run: |
          make dist
          { echo "bean-check.html, SHA-256:"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bean-check
          path: dist/
      # make tools builds staticcheck with the Go of go.mod, at the version
      # that the Makefile names. make vuln runs apart, in vuln.yml.
      - name: Lint
        run: |
          make tools
          PATH="$(go env GOPATH)/bin:$PATH" make lint
      - name: Verify build, tests and vectors
        run: |
          make fmt vet build prose test vectors second compare pack pool bundles device example demo
      - name: Differential against base
        if: github.event_name == 'pull_request'
        env:
          OLD: ${{ github.event.pull_request.base.sha }}
        run: make differential
