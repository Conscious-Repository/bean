name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install -r tools/requirements.txt
      # Before anything else writes a file: the page names its commit only
      # when it is built from a clean checkout.
      - name: Build the check page and record its SHA-256
        run: |
          make dist
          { echo "bean-check.html, SHA-256:"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bean-check
          path: dist/
      - name: Verify build, tests and vectors
        run: |
          make fmt vet build prose test vectors second compare pack pool bundles device example demo
      - name: Differential against base
        if: github.event_name == 'pull_request'
        env:
          OLD: ${{ github.event.pull_request.base.sha }}
        run: make differential
